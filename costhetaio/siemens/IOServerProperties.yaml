# =====================================================================================================================
# IOServerProperties.yaml - Siemens S7-1515: tag name -> address, for costhetaio/siemens/IOServer.py
# ---------------------------------------------------------------------------------------------------------------------
# Source: 'HUb_and_Knuckle_Revised_Assembly_Process.xlsx', last column (DB500); final addresses as agreed 2026-10-31.
# The KEYS are the tag names the IOServer uses when plc.vendor=siemens: the siemens.*.tagname values in
# ApplicationConfiguration.properties (they are the names in the spreadsheet). Every one of those names must be here.
#
# Address syntax (pyS7): DB<n>,X<byte>.<bit> = BOOL, DB<n>,I<byte> = INT (16-bit), DB<n>,R<byte> = REAL (32-bit).
# The `type` field must agree with the address letter (checked at start-up). `dir`: r = PLC writes / PC reads,
# w = PC writes / PLC reads. Start-up also refuses two tags at the same address or overlapping words.
#
# PLC-SIDE PREREQUISITES
#   * CPU -> Protection & Security -> permit PUT/GET communication from remote partner.
#   * DB500 -> Properties -> "Optimized block access" UNCHECKED (absolute offsets).
#   * DB500 elements at I<n> declared Int (not DInt), at R<n> declared Real.
#   * PLC->PC and PC->PLC bits share bytes in DB500. The PC writes single bits (pyS7 BIT transport), never whole
#     bytes, so it does not overwrite the PLC's bits; the PLC program must likewise set / reset single bits only.
# =====================================================================================================================

plc:
  # IP: siemens.plc.ip in ApplicationConfiguration.properties (192.168.1.10). An address here would override it.
  rack: 0                     # S7-1500: rack 0
  slot: 1                     # S7-1500: slot 1
  pdu_size: 480               # as in s7_smoke_test.py
  timeout: 5.0                # socket timeout, seconds
  connect_retries: 3          # connection attempts per connectPLC() call

tags:

  # --- Step 1-2: QR code -------------------------------------------------------------------------------------------
  PLC_PC_CheckQRCode:                        { address: "DB500,X2.5", type: bool,  dir: r }
  PC_PLC_QRCodeCheckOK:                      { address: "DB500,X0.1", type: bool,  dir: w }
  PC_PLC_QRCodeCheckDone:                    { address: "DB500,X0.2", type: bool,  dir: w }
  # State 2 cycle settings: side from the QR code; the rest from machine_settings in the database (frontend:
  # Machine Settings, Administrator / Supervisor). No model / component type: the PLC does not need it.
  PC_PLC_LH_RH_Selection:                    { address: "DB500,I34",  type: int,   dir: w }   # 1 = LHS, 2 = RHS
  PC_PLC_TighteningTorque1Setpoint:          { address: "DB500,R40",  type: float, dir: w }   # Nm, > 0 and < 20
  PC_PLC_TighteningTorque2Setpoint:          { address: "DB500,R44",  type: float, dir: w }   # Nm, > 0 and < 20
  PC_PLC_RotationRPM:                        { address: "DB500,R36",  type: float, dir: w }   # 20 - 40 rpm
  PC_PLC_NoOfRotation1CCW:                   { address: "DB500,R18",  type: float, dir: w }   # 1 or 2
  PC_PLC_NoOfRotation1CW:                    { address: "DB500,R22",  type: float, dir: w }   # 1 or 2

  # --- Step 3: knuckle ---------------------------------------------------------------------------------------------
  PLC_PC_CheckKnuckle:                       { address: "DB500,X3.3", type: bool,  dir: r }
  PC_PLC_KnuckleCheckOK:                     { address: "DB500,X1.7", type: bool,  dir: w }
  PC_PLC_KnuckleCheckDone:                   { address: "DB500,X2.0", type: bool,  dir: w }

  # --- Step 5: hub (with bottom bearing) ----------------------------------------------------------------------------
  PLC_PC_CheckHub:                           { address: "DB500,X2.2", type: bool,  dir: r }
  PC_PLC_HubCheckOK:                         { address: "DB500,X0.4", type: bool,  dir: w }
  PC_PLC_HubCheckDone:                       { address: "DB500,X0.3", type: bool,  dir: w }

  # --- Step 7: top bearing -----------------------------------------------------------------------------------------
  PLC_PC_CheckBearing:                       { address: "DB500,X2.1", type: bool,  dir: r }
  PC_PLC_BearingCheckOK:                     { address: "DB500,X0.7", type: bool,  dir: w }
  PC_PLC_BearingCheckDone:                   { address: "DB500,X1.0", type: bool,  dir: w }

  # --- Step 9: nut and plate washer --------------------------------------------------------------------------------
  PLC_PC_CheckNutAndPlateWasher:             { address: "DB500,X2.3", type: bool,  dir: r }
  PC_PLC_NutAndPlateWasherCheckOK:           { address: "DB500,X1.1", type: bool,  dir: w }
  PC_PLC_NutAndPlateWasherCheckDone:         { address: "DB500,X1.2", type: bool,  dir: w }

  # --- Steps 10 and 18: Station 2 tightening (torque 1 and torque 2) -----------------------------------------------
  PLC_PC_Station2TorqueValueSet:             { address: "DB500,X2.6", type: bool,  dir: r }
  PLC_PC_Station2TorqueValue:                { address: "DB500,R8",   type: float, dir: r }
  PLC_PC_Station2RotationDuringTighteningDone: { address: "DB500,X3.6", type: bool, dir: r }  # read and logged only

  # --- Step 13: bunk for component press ---------------------------------------------------------------------------
  PLC_PC_CheckBunkForComponentPress:         { address: "DB500,X4.0", type: bool,  dir: r }
  PC_PLC_BunkForComponentPressCheckOK:       { address: "DB500,X4.1", type: bool,  dir: w }
  PC_PLC_BunkForComponentPressCheckDone:     { address: "DB500,X4.2", type: bool,  dir: w }

  # --- Steps 14-15: component press done (state READ_COMPONENT_PRESS_DONE) -----------------------------------------
  PLC_PC_ComponentPressDone:                 { address: "DB500,X3.5", type: bool,  dir: r }

  # --- Step 17: no bunk --------------------------------------------------------------------------------------------
  PLC_PC_CheckNoBunk:                        { address: "DB500,X4.3", type: bool,  dir: r }
  PC_PLC_NoBunkCheckOK:                      { address: "DB500,X4.5", type: bool,  dir: w }
  PC_PLC_NoBunkCheckDone:                    { address: "DB500,X4.4", type: bool,  dir: w }

  # --- Step 21: split pin and washer -------------------------------------------------------------------------------
  PLC_PC_CheckSplitPinAndWasher:             { address: "DB500,X3.0", type: bool,  dir: r }
  PC_PLC_SplitPinAndWasherCheckOK:           { address: "DB500,X0.6", type: bool,  dir: w }
  PC_PLC_SplitPinAndWasherCheckDone:         { address: "DB500,X0.5", type: bool,  dir: w }

  # --- Step 23: cap ------------------------------------------------------------------------------------------------
  PLC_PC_CheckCap:                           { address: "DB500,X3.1", type: bool,  dir: r }
  PC_PLC_CapCheckOK:                         { address: "DB500,X1.3", type: bool,  dir: w }
  PC_PLC_CapCheckDone:                       { address: "DB500,X1.4", type: bool,  dir: w }

  # --- Step 25: bunk for cap press ---------------------------------------------------------------------------------
  PLC_PC_CheckBunkForCapPress:               { address: "DB500,X2.4", type: bool,  dir: r }
  PC_PLC_BunkForCapPressCheckOK:             { address: "DB500,X1.5", type: bool,  dir: w }
  PC_PLC_BunkForCapPressCheckDone:           { address: "DB500,X1.6", type: bool,  dir: w }

  # --- Step 27: cap press done (Station 4) -------------------------------------------------------------------------
  PLC_PC_Station4CapPressDone:               { address: "DB500,X3.2", type: bool,  dir: r }

  # --- Step 28: Station 3 free-rotation torque ---------------------------------------------------------------------
  PLC_PC_Station3TorqueValueSet:             { address: "DB500,X2.7", type: bool,  dir: r }
  PLC_PC_Station3TorqueValue:                { address: "DB500,R12",  type: float, dir: r }

  # --- System ------------------------------------------------------------------------------------------------------
  PC_PLC_ConnectionStatusTag:                { address: "DB500,X0.0", type: bool,  dir: w }   # PC toggles every 2 s
  PLC_PC_EmergencyAbort:                     { address: "DB500,X3.4", type: bool,  dir: r }
  PLC_PC_WatchTag:                           { address: "DB500,I6",   type: int,   dir: r }   # must read 1234

# Unused on Machine 2 (in the spreadsheet, not used by the IOServer):
#   PC_PLC_NoOfRotation2CCW DB500,R26   PC_PLC_NoOfRotation2CW DB500,R30
#   PLC_PC_Station4CapPressValueSet DB500,X4.6 (spurious)
