allenbradley.vision.machine.state.9.target.height=720
allenbradley.vision.machine.state.13.target.width=1280
allenbradley.vision.machine.state.13.target.height=720
allenbradley.vision.machine.state.16.target.width=1280
allenbradley.vision.machine.state.16.target.height=720
