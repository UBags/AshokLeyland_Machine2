qrcode.port=COM3
qrcode.baudrate=38400
qrcode.regex.pattern.1=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{3}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[a-z][A-Z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.regex.pattern.2=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{4}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[a-z][A-Z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.regex.pattern.3=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{5}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[a-z][A-Z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.regex.pattern.4=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{3}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[A-Z][a-z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.regex.pattern.5=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{4}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[A-Z][a-z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.regex.pattern.6=\d{7}\$\d{6}[A-Z]{2}\d{1}[A-Z]\$\d{5}\$\d{2}\.\d{2}\.\d{4}\$[A-Z]\d{7}\$[A-Z]{3}\$\d{2}[A-Z][a-z]\d{1}\-[A-Z]\$\d{1}\$[A-Z]{4}
qrcode.partmapping.1=7204838$400112VA1D.DOST.LHS$2.0T
qrcode.partmapping.2=7204838$400102VA1D.DOST.RHS$2.0T
qrcode.partmapping.3=8201206$400112VA1C.DOSTPLUS.LHS$2.5T
qrcode.partmapping.4=8201206$400102VA1C.DOSTPLUS.RHS$2.5T
# Holes in each model's bung (<MODEL>.NoOfHolesInBung; models as in qrcode.partmapping.N). Chooses the bung checks'
# hole-pattern routine: 2 = a pair of holes, 4 = a square. A model without this property: the bung check is NOT OK.
DOST.NoOfHolesInBung=4
DOSTPLUS.NoOfHolesInBung=2
