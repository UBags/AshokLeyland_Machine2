# Washer presence detection control
check.washers.presence.in.nutandplatewasher=True

# *********************************** SIEMENS S7-1515 (used when plc.vendor=siemens) ************************************
# The tag names are shared with the Allen-Bradley PLC (keys without a prefix, from
# 'HUb_and_Knuckle_Revised_Assembly_Process.xlsx'); their DB500 / DB101 addresses are in
