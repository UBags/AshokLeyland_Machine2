# *********************************** VISION CHECK PARAMETERS - ALLEN-BRADLEY / MACHINE 1 *********************************
# Read at camera-server start-up by camera/VisionConfig.py. Every value below equals the value that was hard-coded
# in the check before it became configurable (verified by test/machine2_dryrun/Verify_Vision_Config_Equivalence.py).
# A missing key uses that built-in default; an invalid value uses the default and prints a warning. Any value that
# differs from its built-in default is listed in the camera server log at start-up.
# Formats: number | x,y (tuple, same element count) | a,b,c (list) | x1,y1;x2,y2 (points). Coordinates are full-image px
# unless stated otherwise. Restart the application after changing a value.

# ---- Knuckle check, state 3 (camera/CheckKnuckle.py) ----
# LHS/RHS side boxes (x,y,width,height); side is dark if mean < lhs.rhs.darkness.threshold after binarising at binarization.threshold
allenbradley.vision.knuckle.lhs.crop.x=380
allenbradley.vision.knuckle.lhs.crop.y=650
allenbradley.vision.knuckle.lhs.crop.width=130
allenbradley.vision.knuckle.lhs.crop.height=50
allenbradley.vision.knuckle.rhs.crop.x=765
allenbradley.vision.knuckle.rhs.crop.y=650
allenbradley.vision.knuckle.rhs.crop.width=100
allenbradley.vision.knuckle.rhs.crop.height=55
allenbradley.vision.knuckle.common.check.a.x=775
allenbradley.vision.knuckle.common.check.a.y=300
allenbradley.vision.knuckle.common.check.a.width=35
allenbradley.vision.knuckle.common.check.a.height=25
allenbradley.vision.knuckle.common.check.b.x=440
allenbradley.vision.knuckle.common.check.b.y=310
allenbradley.vision.knuckle.common.check.b.width=40
allenbradley.vision.knuckle.common.check.b.height=20
allenbradley.vision.knuckle.common.check.threshold=84
allenbradley.vision.knuckle.common.check.c.center.x=390
allenbradley.vision.knuckle.common.check.c.center.y=465
allenbradley.vision.knuckle.common.check.c.radius=13
allenbradley.vision.knuckle.common.check.d.center.x=865
allenbradley.vision.knuckle.common.check.d.center.y=465
allenbradley.vision.knuckle.common.check.d.radius=13
allenbradley.vision.knuckle.common.check.e.x=600
allenbradley.vision.knuckle.common.check.e.y=600
allenbradley.vision.knuckle.common.check.e.width=50
allenbradley.vision.knuckle.common.check.e.height=20
# Alternate area of each common check (passes if the region OR its alternate is dark; yellow paint marks on the knuckle). width / height / radius 0 = no alternate
allenbradley.vision.knuckle.common.check.a.alt.x=0
allenbradley.vision.knuckle.common.check.a.alt.y=0
allenbradley.vision.knuckle.common.check.a.alt.width=0
allenbradley.vision.knuckle.common.check.a.alt.height=0
allenbradley.vision.knuckle.common.check.b.alt.x=0
allenbradley.vision.knuckle.common.check.b.alt.y=0
allenbradley.vision.knuckle.common.check.b.alt.width=0
allenbradley.vision.knuckle.common.check.b.alt.height=0
allenbradley.vision.knuckle.common.check.c.alt.center.x=0
allenbradley.vision.knuckle.common.check.c.alt.center.y=0
allenbradley.vision.knuckle.common.check.c.alt.radius=0
allenbradley.vision.knuckle.common.check.d.alt.center.x=0
allenbradley.vision.knuckle.common.check.d.alt.center.y=0
allenbradley.vision.knuckle.common.check.d.alt.radius=0
allenbradley.vision.knuckle.common.check.e.alt.x=0
allenbradley.vision.knuckle.common.check.e.alt.y=0
allenbradley.vision.knuckle.common.check.e.alt.width=0
allenbradley.vision.knuckle.common.check.e.alt.height=0
allenbradley.vision.knuckle.step2.polygon.points=480,260;490,228;495,270;460,290
allenbradley.vision.knuckle.step3.polygon.points=785,265;820,290;770,280;760,235
allenbradley.vision.knuckle.lhs.rhs.darkness.threshold=220
allenbradley.vision.knuckle.component.identification.darkness.threshold=96
allenbradley.vision.knuckle.binarization.threshold=48
allenbradley.vision.knuckle.kernel.size=5,5
# Side and presence by differences (CheckKnuckle; off on Machine 1: side boxes and rectangle A as before)
allenbradley.vision.knuckle.side.by.difference=False
allenbradley.vision.knuckle.side.difference.threshold=10
allenbradley.vision.knuckle.common.check.a.polygon.points=0,0;0,0;0,0
allenbradley.vision.knuckle.common.check.a.alt.polygon.points=0,0;0,0;0,0

# ---- Hub and bottom bearing check (camera/HubAndBearingSegmenter.py, camera/CheckHubAndBottomBearing.py) ----
# Mask shape classification: max major/minor axis ratio to count as a circle, by size band (<10, <20, <40, others px)
allenbradley.vision.hub.major.minor.axis.cutoff.if.less.than.10=1.3
allenbradley.vision.hub.major.minor.axis.cutoff.if.less.than.20=1.2
allenbradley.vision.hub.major.minor.axis.cutoff.if.less.than.40=1.15
allenbradley.vision.hub.major.minor.axis.cutoff.for.others=1.1
# Size sub-grouping: allowed spread around group median radius, by size band
allenbradley.vision.hub.grouping.radius.variance.percentage.less.than.10=0.25
allenbradley.vision.hub.grouping.radius.variance.percentage.less.than.20=0.2
allenbradley.vision.hub.grouping.radius.variance.percentage.less.than.40=0.15
allenbradley.vision.hub.grouping.radius.variance.percentage.more.than.40=0.1
# Ill-shaped mask filter: min (mask area / fitted ellipse area), by size band
allenbradley.vision.hub.area.ratio.threshold.if.less.than.10=0.5
allenbradley.vision.hub.area.ratio.threshold.if.less.than.20=0.55
allenbradley.vision.hub.area.ratio.threshold.if.less.than.40=0.6
allenbradley.vision.hub.area.ratio.threshold.for.others=0.65
# Grouping by distance from centre, and chord-spacing tolerances (strict, then relaxed fallback)
allenbradley.vision.hub.percentage.spread.for.grouping.from.center=0.15
allenbradley.vision.hub.equispacing.strict.tolerance=0.1
allenbradley.vision.hub.equispacing.relaxed.tolerance=0.2
# Annular segmentation ROI (full-image pixels); also positions the result overlay
allenbradley.vision.hub.segment.center.x=635
allenbradley.vision.hub.segment.center.y=345
allenbradley.vision.hub.segment.outer.radius=250
allenbradley.vision.hub.segment.inner.radius=120
# Hole candidates: mask area limits (px) and YOLO proposal confidence cut-off
allenbradley.vision.hub.min.mask.area=100
allenbradley.vision.hub.max.mask.area=3000
allenbradley.vision.hub.yolo.conf.threshold=0.3
# Polygon acceptance: max fractional deviation of each angular gap from 360/K
allenbradley.vision.hub.equal.angle.tolerance=0.15
# 'No bearing in centre' check (CheckHubAndBottomBearing.py), only when the caller passes enforceBearingAbsenceCheck=True:
# annulus centre/radii; fails if mean gray (gamma 3) >= max.mean (open bore 105-130, bearing 150-178)
allenbradley.vision.hub.centre.check.x=635
allenbradley.vision.hub.centre.check.y=350
allenbradley.vision.hub.centre.check.outer.radius=60
allenbradley.vision.hub.centre.check.inner.radius=20
allenbradley.vision.hub.centre.check.max.mean=140

# ---- Top bearing check, state 7 (camera/CheckTopBearing.py) ----
# Binarisation cut-off percentile for black pixels
allenbradley.vision.topbearing.percentile.cut.off.for.black.pixels=25
# Branch acceptance: valid only if min(score_A, score_B) > lower.score.threshold AND mean green in ring > average.g.threshold
allenbradley.vision.topbearing.lower.score.threshold=0.65
allenbradley.vision.topbearing.average.g.threshold=77
# Radius (px, annular crop) of the disc used to compute the binarisation percentile; also lower bound of the radial trace distance
allenbradley.vision.topbearing.detection.mask.radius=60
# Radial tracing: accepted inner/outer edge distances as multiples of prompt.radius
allenbradley.vision.topbearing.inner.edge.min.dist.factor=0.65
allenbradley.vision.topbearing.inner.edge.max.dist.factor=1.2
allenbradley.vision.topbearing.outer.edge.min.dist.factor=0.8
allenbradley.vision.topbearing.outer.edge.max.dist.factor=1.6
# Expected bearing ring thickness (px): percentile selection target / ideal-area term of score_B
allenbradley.vision.topbearing.target.ring.thickness=14
allenbradley.vision.topbearing.target.ring.thickness.for.area.score=15
# Annular ROI in the full image (centre, radii) and normalisation tile sizes
allenbradley.vision.topbearing.annular.center.x=632
allenbradley.vision.topbearing.annular.center.y=360
allenbradley.vision.topbearing.annular.outer.radius=120
allenbradley.vision.topbearing.annular.inner.radius=0
allenbradley.vision.topbearing.bg.norm.sx=40
allenbradley.vision.topbearing.bg.norm.sy=40
allenbradley.vision.topbearing.contrast.norm.sx=10
allenbradley.vision.topbearing.contrast.norm.sy=10
# Nominal ring radius (px) from the crop centre used by radial tracing
allenbradley.vision.topbearing.prompt.radius=40
# Final check: gamma-corrected ring brightness (current - hub reference) must exceed final.gamma.threshold
allenbradley.vision.topbearing.final.gamma.threshold=30.0
allenbradley.vision.topbearing.final.gamma.value=3.0
# Parallel branches: gamma values x centre offsets (dx,dy;dx,dy relative to crop centre)
allenbradley.vision.topbearing.gamma.candidates=3.0,4.0,5.0,6.0,6.5
allenbradley.vision.topbearing.center.offsets=0,0;0,-10
# Ring refinement after the winning branch: outer edge searched round the branch's outer circle (centre +/- centre.span,
# radius +/- outer.radius.span), inner edge concentric at a width of target.ring.thickness +/- thickness.span (step in px)
allenbradley.vision.topbearing.refine.ring=True
allenbradley.vision.topbearing.refine.centre.span=4.0
allenbradley.vision.topbearing.refine.outer.radius.span=10.0
allenbradley.vision.topbearing.refine.thickness.span=2.0
allenbradley.vision.topbearing.refine.step=0.5
# Accepted bearing ring (px): outer diameter and width (outer minus inner radius); a ring outside is not a top bearing
# (a nut found as a ring is about 76-81 px across, a bearing 92-102)
allenbradley.vision.topbearing.outer.diameter.min=86.0
allenbradley.vision.topbearing.outer.diameter.max=113.0
allenbradley.vision.topbearing.width.min=9.0
allenbradley.vision.topbearing.width.max=21.0
# ... and the mean diameter (inner and outer edge averaged round the ring) at least this (bearings 78-87, nuts 64-70)
allenbradley.vision.topbearing.mean.diameter.min=75.0
# Inner diameter minimum (2 x inner edge radius), 0 = not checked
allenbradley.vision.topbearing.inner.diameter.min=0.0

# ---- Nut and plate washer check, state 9 (camera/CheckNutAndPlateWasher.py) ----
# Washer present if diff_R > washer.threshold.r AND diff_RB > washer.threshold.rb (after gamma washer.gamma); nut searched in a disc of radius nut.detection.radius around nut.detection.center
allenbradley.vision.nutwasher.washer.threshold.r=0.55
allenbradley.vision.nutwasher.washer.threshold.rb=3.5
# R-B test on (diff_R and diff_RB both decide)
allenbradley.vision.nutwasher.washer.check.rb=True
allenbradley.vision.nutwasher.washer.gamma=3.0
# Washer comparison area: the bearing ring's measured edges moved this many px into the race (outer inward, inner outward), minus the nut
allenbradley.vision.nutwasher.washer.mask.edge.margin=1.0
allenbradley.vision.nutwasher.nut.detection.center=632,360
allenbradley.vision.nutwasher.nut.detection.radius=80
# Accepted nut (px): outer diameter (circle of the nut outline's area); the width (outer radius minus the bore radius) is only
# reported, not limited; a shape outside is not a nut (a bearing ring is about 92-102 px across)
allenbradley.vision.nutwasher.nut.outer.diameter.min=64.0
allenbradley.vision.nutwasher.nut.outer.diameter.max=84.0
# ... and the mean diameter (outline and bore averaged round the nut) within min-max (nuts 64-70, a whole bearing 78-87, a disc the size of a bearing's bore 54-58)
allenbradley.vision.nutwasher.nut.mean.diameter.min=60.0
allenbradley.vision.nutwasher.nut.mean.diameter.max=72.0
# Fallback when the nut detector accepts no hexagon: the top bearing ring finder on the nut picture; a ring of a nut's size
# is accepted as the nut (nuts 75-82 px across, mean 64-68; bearings 92-102 / 78-87; washer only: no ring)
allenbradley.vision.nutwasher.nut.ring.fallback=True
allenbradley.vision.nutwasher.nut.ring.outer.diameter.min=70.0
allenbradley.vision.nutwasher.nut.ring.outer.diameter.max=86.0
allenbradley.vision.nutwasher.nut.ring.mean.diameter.max=74.0

# ---- Hexagon nut detector (camera/HexagonNutDetector.py) ----
# Candidate generation: YOLO confidence and SAM mask area window (px)
allenbradley.vision.nut.yolo.conf.threshold=0.3
allenbradley.vision.nut.min.mask.area=3000
allenbradley.vision.nut.max.mask.area=5500
# Hexagon shape acceptance: vertex count range and bounding-box aspect ratio (exclusive)
allenbradley.vision.nut.min.vertices=5
allenbradley.vision.nut.max.vertices=8
allenbradley.vision.nut.min.aspect.ratio=0.7
allenbradley.vision.nut.max.aspect.ratio=1.3
# Centre-disc exclusion and remaining-area checks
allenbradley.vision.nut.center.disc.radius=25
allenbradley.vision.nut.min.remaining.area.fraction=0.3
allenbradley.vision.nut.min.vertices.after.disc=4
allenbradley.vision.nut.min.actual.area=2000
# Straight-edge check and fixed reference centre (annular-crop coordinates) for symmetry scoring
allenbradley.vision.nut.edge.min.length.factor=0.8
allenbradley.vision.nut.reference.center.x=72
allenbradley.vision.nut.reference.center.y=64
# Bearing rejection: reject when any of these rules fires (scores are 0-100)
allenbradley.vision.nut.min.symmetry.score=55
allenbradley.vision.nut.reject.deviated.pixels.zero.edges=28
allenbradley.vision.nut.reject.deviated.pixels.one.edge=35
# Debug-message thresholds only (symmetry rejection is disabled in code)
allenbradley.vision.nut.symmetry.reject.threshold=1.1
allenbradley.vision.nut.symmetry.warning.threshold=1.4

# ---- No-bunk check, state 16 (camera/CheckNoBunk.py): nut searched in a disc around this centre ----
allenbradley.vision.nobunk.nut.detection.center=632,360
allenbradley.vision.nobunk.nut.detection.radius=80

# ---- Cap check, state 23 (camera/CheckCap.py): (1) which cap - brass if mean R-B in the DOSTPLUS circle is above
# rb.threshold.dostplus, else silver if R-B in the DOST circle is below rb.threshold.dost and the silver brightness test
# passes, else none; (2) it must be the model's cap (DOST silver, DOSTPLUS brass); (3) brightening against the hub, top
# bearing and nut/washer pictures of the same part must reach the limits of the cap found ----
allenbradley.vision.cap.center=635,360
allenbradley.vision.cap.radius.dost=100
allenbradley.vision.cap.radius.dostplus=70
allenbradley.vision.cap.rb.threshold.dost=-1.0
allenbradley.vision.cap.rb.threshold.dostplus=15.0
allenbradley.vision.cap.delta.threshold.hub.dost=30.0
allenbradley.vision.cap.delta.threshold.top.dost=30.0
allenbradley.vision.cap.delta.threshold.nut.dost=35.0
allenbradley.vision.cap.delta.threshold.hub.dostplus=35.0
allenbradley.vision.cap.delta.threshold.top.dostplus=50.0
allenbradley.vision.cap.delta.threshold.nut.dostplus=35.0
# silver cap test, after the brass test fails: mean brightness within the radius must reach the minimum (0.0 = off)
allenbradley.vision.cap.silver.brightness.radius=25
allenbradley.vision.cap.silver.brightness.min=0.0

# ---- Bunk check, shared by component-press (state 13, CheckNoCapBunk) and cap-press (state 24, CheckBunk) (camera/BunkSegmenter.py) ----
# Two-stage circular crop: outer disc in full-image px (centre +- radius must stay inside the image), inner disc radius measured from the outer-disc centre
allenbradley.vision.bunk.outer.disc.center=630,350
allenbradley.vision.bunk.outer.disc.radius=250
allenbradley.vision.bunk.inner.disc.radius=110
# SAM mask area window (pixels inside the inner disc)
allenbradley.vision.bunk.min.mask.area=325
allenbradley.vision.bunk.max.mask.area=1200
# Hole bounding box must be within 0.5x..1.5x this value (px)
allenbradley.vision.bunk.expected.radius.of.hole=30
# DOST: 4-hole square acceptance (side-length tolerance as a fraction; angles in degrees)
allenbradley.vision.bunk.square.side.length.tolerance=0.2
allenbradley.vision.bunk.square.min.interior.angle=65.0
allenbradley.vision.bunk.square.max.interior.angle=115.0
allenbradley.vision.bunk.square.max.angle.std=20.0
# DOSTPLUS: 2-hole acceptance - centre-to-centre distance window (px)
allenbradley.vision.bunk.dostplus.hole.pair.distance.min=75
allenbradley.vision.bunk.dostplus.hole.pair.distance.max=100
# 3 holes, one in the middle of the other two (e.g. the centre punch mark): middle one ignored when the angle at it is
# within max.bend (deg) of a straight line and its distances to the other two differ by at most max.distance.difference
allenbradley.vision.bunk.three.hole.max.bend=10.0
allenbradley.vision.bunk.three.hole.max.distance.difference=0.25
# *********************************** VISION CHECK PARAMETERS DONE - ALLEN-BRADLEY / MACHINE 1 *********************************

# *********************************** UNUSED CONSTANTS - ALLEN-BRADLEY / MACHINE 1 *********************************
# Vision constants that are declared in the code but NOT read by any live code path. Changing them has no effect
# today. They are kept here, at their current values, so they are visible and can be wired in later if needed.
# Bunk (camera/BunkSegmenter.py): superseded by vision.bunk.square.* (the live square check uses 0.2 / 65.0 / 115.0 / 20.0)
allenbradley.vision.unused.bunk.equidistant.distance.deviation.threshold=0.25
allenbradley.vision.unused.bunk.minimum.interior.angle=65.0
allenbradley.vision.unused.bunk.allowed.std.deviation.in.angles=20.0
# Hub (camera/HubAndBearingSegmenter.py): POLYGON_* are not referenced at all; GOOD_FIT_*, DOMINANCE_RATIO and
# REGULARITY_* are used only by find_best_polygon_with_cross_validation / validate_regular_polygon_strict, which are
# reached only from try_remove_outlier_mask, which nothing calls
allenbradley.vision.unused.hub.polygon.angular.tolerance=0.15
allenbradley.vision.unused.hub.polygon.radial.tolerance=0.2
allenbradley.vision.unused.hub.good.fit.threshold.k4=0.25
allenbradley.vision.unused.hub.good.fit.threshold.k5=0.3
allenbradley.vision.unused.hub.dominance.ratio=0.7
allenbradley.vision.unused.hub.regularity.angular.tolerance=0.15
allenbradley.vision.unused.hub.regularity.side.tolerance=0.15
allenbradley.vision.unused.hub.regularity.radial.tolerance=0.2
# Top bearing (camera/CheckTopBearing.py): MAX_ALLOWED_CENTER_PERCENT_DEVIATION is not referenced
allenbradley.vision.unused.topbearing.max.allowed.center.percent.deviation=25.0
# *********************************** UNUSED CONSTANTS DONE - ALLEN-BRADLEY / MACHINE 1 *********************************

# *********************************** CAMERA AND IMAGE SETTINGS - SIEMENS / MACHINE 2 *********************************
# Read through CosThetaConfigurator.getValue(<key>) (e.g. getCameraIP(), getTargetWidthAndHeight()), which reads
# siemens.vision.<key> on this machine.
# Camera
siemens.vision.camera.id=1
siemens.vision.camera.ip=192.168.250.64
siemens.vision.camera.port=80
siemens.vision.camera.uid=admin
siemens.vision.camera.pwd=Leyland9753
# Picture timing and missing-frame limit
siemens.vision.time.between.pictures.ms=100
siemens.vision.max.allowed.none.frame.counts.in.camera=500
siemens.vision.sleeptime.monitor.takepic=0.02
# A vision check that takes longer than this (seconds) is NOT OK ("check timed out"). With check.in.worker.process
# the checks run in a separate process, which is stopped and started again when a check times out.
siemens.vision.check.timeout.sec=12
siemens.vision.check.in.worker.process=True
# Target width and height of the image in each vision-check state
