# LOGGING LEVELS CAN BE ONLY CONSIDER_ACTION OR TAKE_ACTION IN PRODUCTION, AND
# DEBUG, INFO, TAKE_NOTE, CONSIDER_ACTION OR TAKE_ACTION IN TEST
# FILE LOGGING PARAMETERS
file.loggingLevel=INFO
logging.directory=logs
filelogging.format=%(asctime)s.%(msecs)03d: %(levelname)s %(module)s - %(funcName)s: %(message)s
#filelogging.format=%(name)-9s > [%(levelname)s] [%(asctime)s.%(msecs)03d] : %(message)s
#filelogging.format='%(name)-14s > [%(levelname)s] [%(asctime)s] : %(message)s'
filelogging.date.format=%d%m%Y %H:%M:%S
#filelogging.date.format='%d%m%Y %H:%M:%S'
loggingfile.suffix=log
backuplogs.count=15
# LOGGING LEVELS CAN BE ONLY CONSIDER_ACTION OR TAKE_ACTION IN PRODUCTION, AND
# DEBUG, INFO, TAKE_NOTE, CONSIDER_ACTION OR TAKE_ACTION IN TEST
# CONSOLE LOGGING PARAMETERS
console.logginglevel=TAKE_NOTE
consolelogging.format=%(asctime)s.%(msecs)03d: %(name)-9s: %(levelname)-8s %(asctime)s %(message)s
# ---- PER-SERVER LOGGING AND LOG FILE HANDLING (all applied while running; see logutils/LogSettings.py) ----
# Level per server; empty = file.loggingLevel / console.logginglevel above.
# Levels: DEBUG | INFO | TAKE_NOTE | CONSIDER_ACTION | TAKE_ACTION. In PRODUCTION mode anything below CONSIDER_ACTION
# is raised to CONSIDER_ACTION (as for the global levels).
log.file.level.mainprogram=
log.file.level.ioserver=
log.file.level.cameraserver=
log.file.level.qrcodeserver=
log.file.level.frontend=
log.file.level.dbserver=
log.file.level.heartbeatserver=
log.console.level.mainprogram=
log.console.level.ioserver=
log.console.level.cameraserver=
log.console.level.qrcodeserver=
log.console.level.frontend=
log.console.level.dbserver=
log.console.level.heartbeatserver=
# The coloured console prints also go to the log file (red = CONSIDER_ACTION, yellow = TAKE_NOTE, grey = DEBUG,
# others = INFO; subject to the level above)
log.mirror.prints.to.file=True
# PLC audit trail in the log file, whatever the level: every PC->PLC write, every PLC->PC trigger / value, every state
# change, each line with [QR=... cycle=N]. The connection-status toggle (every 2 s) only if the second key is True.
log.audit.plc=True
log.audit.plc.connection.toggle=False
# Exceptions caught and ignored in the code: one DEBUG line per place (then every 100th occurrence)
log.suppressed.exceptions=True
# New log file at midnight and when the file exceeds the size (MB, 0 = no limit); backuplogs.count files are kept
log.file.rotate.daily=True
log.file.max.size.mb=50
# Messages queued before the logging server started are written if newer than this; older ones are counted only
log.file.keep.queued.minutes=10
# ---- LIVE CONFIGURATION ----
# This file is re-read when it changes, checked every config.reload.check.interval.sec seconds. Applied while running:
# logging (above), vision parameters (<vendor>.vision.*; the next picture uses them), image target sizes, gap between
# pictures, missing-frame limit, state instructions (state.<N>.instruction), PLC read / write / connection-check
# intervals and the OK-to-Done delay, the frontend's status / emergency / heartbeat intervals, and every value the
# code reads when it uses it.
# Needs a restart of that server: PLC tag names, PLC IP, plc.vendor, camera connection (<vendor>.vision.camera.*),
# Redis / queue names, database settings. Every change, and every change that needs a restart, is written to the log.
config.reload.check.interval.sec=2
