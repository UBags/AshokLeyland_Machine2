qrcode.partmapping.4=8201206$400102VA1C.DOSTPLUS.RHS$2.5T
# Holes in each model's bung (<MODEL>.NoOfHolesInBung; models as in qrcode.partmapping.N). Chooses the bung checks'
# hole-pattern routine: 2 = a pair of holes, 4 = a square. A model without this property: the bung check is NOT OK.
DOST.NoOfHolesInBung=4
DOSTPLUS.NoOfHolesInBung=2
