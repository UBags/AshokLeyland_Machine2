# Cycle settings the PC writes to the PLC in state 2 (WRITE_QR_CODE), BEFORE QRCodeCheckOK / Done. Same on both PLCs:
#   PC_PLC_LH_RH_Selection             INT   1 = LHS, 2 = RHS       (from the QR part number)
#   PC_PLC_TighteningTorque1/2Setpoint REAL  Nm, > 0 and < 20       (machine_settings, frontend: Machine Settings)
#   PC_PLC_RotationRPM                 REAL  20 - 40 rpm            (machine_settings)
#   PC_PLC_NoOfRotation1CCW / 1CW      REAL  1 or 2                 (machine_settings)
# An empty tag name means the PLC does not have that setting; it is not written (ModelSelection, RotationRPM1/2:
# kept only for cycle.settings.source=properties, the earlier Allen-Bradley set-up).
pc.plc.lh.rh.selection.tagname=PC_PLC_LH_RH_Selection
pc.plc.model.selection.tagname=
pc.plc.tightening.torque1.setpoint.tagname=PC_PLC_TighteningTorque1Setpoint
pc.plc.tightening.torque2.setpoint.tagname=PC_PLC_TighteningTorque2Setpoint
pc.plc.rotation1.rpm.tagname=
pc.plc.rotation2.rpm.tagname=
pc.plc.rotation.rpm.tagname=PC_PLC_RotationRPM
pc.plc.no.of.rotation1.ccw.tagname=PC_PLC_NoOfRotation1CCW
pc.plc.no.of.rotation1.cw.tagname=PC_PLC_NoOfRotation1CW
# If the settings cannot be written (3 attempts each, or the database cannot give them), the cycle goes ahead with
# the settings the PLC already holds (logged, shown on the screen). The side (LH_RH_Selection) must be written: if it
# cannot be, the QR code is answered NOT OK.
# Optional: PC_PLC_CycleAborted (bool), set True by the PC when it aborts a cycle itself (frontend abort, frontend or
# heartbeat server down, PLC restart) and False when the next QR code is accepted. Named here (do not remove: the
# frontend's password-protected abort depends on it), but the PLC has no such tag yet: Siemens: no address in
# costhetaio/siemens/IOServerProperties.yaml on purpose; Allen-Bradley: not in the controller. Until it exists, the
# IOServer skips it (logged once at start) and the frontend's abort stays in the frontend: the IOServer tries to write
# it (3 attempts) and, only if that succeeds, aborts its cycle; otherwise it logs and carries on. When the PLC
# programmer adds it: Siemens - its address in IOServerProperties.yaml; Allen-Bradley - the BOOL tag in the controller.
pc.plc.cycle.aborted.tagname=PC_PLC_CycleAborted
# PC_PLC_Skip_Second_Tightening (bool), written by the PC in state 2 of every cycle (with read-back): True = this
# component skips the bung for the component press, the press, the bung removal and the second tightening (the
# model's Machine Setting "Bypass Component Press and Second Tightening"); the PLC programme branches on it. Named here
# (do not remove), but the PLC has no such tag yet (Siemens: no address in IOServerProperties.yaml). Until it exists:
# full run for every model, whatever the setting (logged). Once it exists, a write that fails answers the QR code
# NOT OK (the PLC might still hold the previous component's value).
pc.plc.skip.second.tightening.tagname=PC_PLC_Skip_Second_Tightening
# Source of the state-2 settings: database (machine_settings, edited in the frontend's Machine Settings dialog) for
# both PLCs. 'properties' = the earlier set-up (the tightening.* / rotation1/2.rpm values below); not used now.
cycle.settings.source=database

# Used only with cycle.settings.source=properties. A value of -1 means "do not write this tag to the PLC".
tightening.torque1.setpoint.nm=15.0
tightening.torque2.setpoint.nm=19.0
rotation1.rpm=-1
rotation2.rpm=-1

plc.read.interval=0.2
plc.write.interval=0.1
plc.connection.check.interval=1.0
plc.ip=192.168.1.1
# Which IOServer MainProgram starts: allenbradley (costhetaio/allenbradley/IOServer.py) or siemens
# (costhetaio/siemens/IOServer.py). Both PLCs use the same tag names (the keys above). For siemens, a key in the
# SIEMENS S7-1515 section replaces the same key without the 'siemens.' prefix (now only the PLC IP); the Siemens tag
# addresses are in costhetaio/siemens/IOServerProperties.yaml. Vision parameters: allenbradley.vision.* / siemens.vision.*
plc.vendor=allenbradley
plc.debug=True
# Result of a vision check or the QR code (Check-Done-OK), written in this order before the machine state changes
# (each write retried until it succeeds; seconds; applied while running):
#   OK=True / False, (ok.and.done) Check=False, Done=True, (OK: done.and.reset_done / NOT OK: done.and.re_read)
#   Done=False, then OK: OK=False / NOT OK: Check=False again; then OK -> next state, NOT OK -> back to the
#   take-picture state (Check and Done both False there)
plc.sleeptime.between.ok.and.done=0.05
plc.sleeptime.between.done.and.re_read=0.3
plc.sleeptime.between.done.and.reset_done=0.4
# Default delay for the PC's delayed tag resets; the torque values and the presses have their own (below)
plc.handshake.reset.delay.sec=0.4
# Torque values (Station 2 torque 1 and 2, Station 3 free-rotation torque): reset this many seconds after the PC has
#   read them: Set=False and Value=0.0 (Station 2: also RotationDuringTighteningDone=False)
plc.handshake.torquevalues.reset.delay.sec=2.0
# Press Done (component press, cap press): reset to False this many seconds after the PC has read it
plc.handshake.componentpress.reset.delay.sec=1.5
# No answer from the camera server this many seconds after a picture request: the check is reported NOT OK to the
# PLC (as for a NOT OK picture). At least <vendor>.vision.check.timeout.sec + 8 s (stopping a timed-out check worker and
# taking the pictures); a smaller value is raised to that when read (and printed once).
plc.camera.answer.timeout.sec=20
# A picture must be a frame that arrived after the picture request (and after the previous picture). No such frame
# within this many seconds (the stream has stalled; its last frame shows the part where it was before): NOT OK.
camera.frame.max.wait.sec=1.0
# A server's heartbeat is DEAD while one of its work threads (camera assessment, DB inserts, IOServer read / write
# loops, frontend GUI, QR code reader) has died or not been round its loop for this many seconds (at least the
# camera answer timeout + 10 s).
heartbeat.work.loop.max.silence.sec=60
# The heartbeat server is taken as down when the IOServer has had no status message from it for this many seconds
# (it sends one every combinedheartbeat.connectionstatus.sleepinterval.sec), once it has sent one: an IOServer run on
# its own (commissioning, the IOServer test windows) has no heartbeat server and works as before. What the IOServer does when a server is
# down: camera -> a picture request is answered NOT OK; QR code server -> nothing; database -> the cycle in progress
# is finished, the next one is held until it is back; frontend or heartbeat server -> the cycle is aborted, the next
# one held until it is back.
ioserver.heartbeat.server.silence.sec=8

